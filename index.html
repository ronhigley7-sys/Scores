<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Football Ticker — NFL + NCAA</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#10271c;color:#f7f4e9;font-family:Arial,Helvetica,sans-serif}
header{background:#1b3a2b;border-bottom:4px solid #f5b942;padding:22px 20px}
h1{font-size:clamp(2rem,6vw,3.6rem);margin:0;color:#f5b942}
.subtitle{font-size:clamp(1rem,2.5vw,1.3rem);margin:12px 0;color:#d6e4d8}
nav{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
nav a,button{background:#f5b942;color:#10271c;border:0;border-radius:7px;padding:13px 20px;font-size:1.15rem;font-weight:800;text-decoration:none;cursor:pointer}
main{padding:24px 16px;max-width:1250px;margin:auto}
#games{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:18px}
.game{background:#204330;border:2px solid #56765e;border-radius:12px;padding:22px}
.league{font-size:1.1rem;color:#f5b942;font-weight:800;margin-bottom:15px}
.team{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:clamp(1.45rem,3vw,2rem);font-weight:800;margin:12px 0}
.score{font-size:clamp(2rem,4vw,3rem);font-variant-numeric:tabular-nums;color:#fff}
.status{font-size:1.3rem;color:#ffb2a9;font-weight:800;border-top:1px solid #56765e;padding-top:14px;margin-top:15px}
.empty{font-size:clamp(1.4rem,3vw,2rem);padding:40px 12px;text-align:center;grid-column:1/-1}
#updated{font-size:1rem;color:#b9cdbd;margin-top:24px}
</style></head><body>
<header><h1>● LIVE FOOTBALL SCORES</h1><p class="subtitle">NFL + NCAA · Only games currently in progress · Refreshes every 5 minutes</p>
<nav><a href="scores.html">All scores &amp; tabs →</a><button id="refresh">↻ Refresh now</button></nav></header>
<main><div id="games"><div class="empty">Checking live games…</div></div><p id="updated"></p></main>
<script>
const sources=[['NFL','https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard'],['NCAA','https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&limit=500']];
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function update(){
 const updated=document.getElementById('updated');
 try{
 const results=await Promise.all(sources.map(async([league,url])=>{
  const res=await fetch(url+(url.includes('?')?'&':'?')+'_='+Date.now(),{cache:'no-store'});
  if(!res.ok)throw Error('Unable to retrieve '+league);
  const data=await res.json();
  return (data.events||[]).filter(e=>e.status?.type?.state==='in').map(e=>({league,event:e}));
 }));
 const games=results.flat();
 document.getElementById('games').innerHTML=games.length?games.map(({league,event})=>{
 const competitors=event.competitions?.[0]?.competitors||[];
 const away=competitors.find(c=>c.homeAway==='away');
 const home=competitors.find(c=>c.homeAway==='home');
 if(!away||!home)return '';
 const team=c=>'<div class="team"><span>'+escapeHTML(c.team?.shortDisplayName||c.team?.displayName)+'</span><span class="score">'+escapeHTML(c.score??'0')+'</span></div>';
 const period=event.status?.period;
 const label=event.status?.type?.name==='STATUS_HALFTIME'?'HALFTIME':('Q'+period+' · '+(event.status?.displayClock||''));
 return '<article class="game"><div class="league">● '+league+' LIVE</div>'+team(away)+team(home)+'<div class="status">'+escapeHTML(label)+'</div></article>';
 }).join(''):'<div class="empty">No NFL or NCAA football games currently in progress.</div>';
 updated.textContent='Last checked: '+new Date().toLocaleTimeString();
 }catch(e){updated.textContent='Could not refresh scores. Retrying in 5 minutes.';console.error(e)}
}
document.getElementById('refresh').addEventListener('click',update);
update();setInterval(update,300000);
</script></body></html>
